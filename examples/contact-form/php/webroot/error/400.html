<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Ungültige Anfrage</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.6 system-ui, sans-serif; background: Canvas; color: CanvasText;
      padding: 2rem;
    }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 3.5rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0.75rem 0 1.5rem; opacity: 0.75; }
    a { color: inherit; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>400</h1>
    <p>Die Anfrage war fehlerhaft.</p>
    <p><a href="/">Zurück zur Startseite</a></p>
  </main>
</body>
</html>
